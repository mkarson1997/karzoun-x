[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "karzoun-x"
version = "0.1.0rc1"
description = "Research prototype for resource-aware, safety-gated local AI spacecraft fault diagnosis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mahmoud Karzoun" }
]
keywords = [
  "spacecraft",
  "artificial-intelligence",
  "fault-diagnosis",
  "telemetry",
  "rag",
  "local-llm",
  "autonomous-systems"
]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1"
]
data = [
  "pandas>=2.2,<4"
]

[project.scripts]
karzoun-x = "karzoun_x.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/karzoun_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"paper/build_preprint.py" = ["E501"]
"paper/build_submission.py" = ["E501"]
"scripts/finalize_followup_manuscript.py" = ["E501", "F841", "F541"]
"scripts/generate_submission_package.py" = ["E501"]
"scripts/promote_v1_release.py" = ["E501"]
"scripts/run_phase11_epistemic_gate.py" = ["E501"]
"scripts/run_phase12_model_resource_ablation.py" = ["E501", "I001", "F401", "B007"]
"scripts/run_phase13_final_synthesis.py" = ["E501"]
