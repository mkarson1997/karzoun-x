name: Generate CI hash lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-ci-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          pip-version: "26.2.1"
      - name: Generate hashed binary lock
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lock-wheels
          mkdir .lock-wheels
          python -m pip download --only-binary=:all: --no-deps -r requirements-ci.txt -d .lock-wheels
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          source = Path("requirements-ci.txt")
          wheel_dir = Path(".lock-wheels")
          output = Path("requirements-ci.lock")

          def canonical(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          wheels: dict[tuple[str, str], Path] = {}
          for wheel in wheel_dir.glob("*.whl"):
              parts = wheel.name[:-4].split("-")
              if len(parts) < 2:
                  raise SystemExit(f"Unexpected wheel filename: {wheel.name}")
              dist = canonical(parts[0])
              version = parts[1]
              wheels[(dist, version)] = wheel

          lines = [
              "# Generated lock for KARZOUN-X CI on Linux x64 / CPython 3.11.",
              "# Exact versions + SHA-256 wheel hashes; install with --require-hashes --only-binary=:all: --no-deps.",
          ]

          for raw in source.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              if "==" not in stripped:
                  raise SystemExit(f"Requirement is not exactly pinned: {stripped}")
              name, version = stripped.split("==", 1)
              key = (canonical(name.strip()), version.strip())
              wheel = wheels.get(key)
              if wheel is None:
                  raise SystemExit(f"No downloaded wheel found for {name}=={version}")
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              lines.append(f"{name.strip()}=={version.strip()} --hash=sha256:{digest}")

          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY
          rm -rf .lock-wheels
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements-ci.lock 2>/dev/null && git ls-files --error-unmatch requirements-ci.lock >/dev/null 2>&1; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-ci.lock
          git commit -m "ci: add hash-verified dependency lock"
          git push origin HEAD:main
