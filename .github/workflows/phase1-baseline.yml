name: Phase 1 SMAP-MSL Baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-baseline.yml
      - scripts/run_phase1_baseline.py
      - experiments/configs/phase1_robust_zscore.json
      - src/karzoun_x/anomaly_detection/**
      - src/karzoun_x/datasets/**
      - src/karzoun_x/evaluation/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install hash-verified experiment dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-ci.lock'

      - name: Download public SMAP/MSL benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/telemanom
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://www.kaggle.com/api/v1/datasets/download/patrickfleith/nasa-anomaly-detection-dataset-smap-msl' \
            --output data/raw/telemanom/dataset.zip
          sha256sum data/raw/telemanom/dataset.zip | tee data/raw/telemanom/dataset.zip.sha256
          unzip -q data/raw/telemanom/dataset.zip -d data/raw/telemanom
          test -f data/raw/telemanom/labeled_anomalies.csv
          test -d data/raw/telemanom/data/train
          test -d data/raw/telemanom/data/test
          echo "Extracted train files: $(find data/raw/telemanom/data/train -name '*.npy' | wc -l)"
          echo "Extracted test files: $(find data/raw/telemanom/data/test -name '*.npy' | wc -l)"

      - name: Run fixed-threshold Phase 1 baseline
        run: |
          python scripts/run_phase1_baseline.py \
            --config experiments/configs/phase1_robust_zscore.json \
            --output-dir results/phase1 | tee results-phase1.log
          cat results/phase1/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-generated results
        uses: actions/upload-artifact@v4
        with:
          name: karzoun-x-phase1-robust-zscore
          path: |
            results/phase1/
            results-phase1.log
            data/raw/telemanom/dataset.zip.sha256
          if-no-files-found: error
          retention-days: 90
