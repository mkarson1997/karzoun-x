name: Post-Phase13 documentation sync

on:
  push:
    branches: [main]
    paths:
      - ".github/post-phase13-docs.trigger"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize results index with completed Phase 11-13 results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experiments/RESULTS_INDEX.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '| `phase11-epistemic-sufficiency-gate-v1` | Protocol frozen, held-out execution pending | Local Ollama | `results/phase11/` after execution |',
              '| `phase11-epistemic-sufficiency-gate-v1` | Completed, held-out paired mitigation | Local Ollama, commit `294fa7742057d026f4762d0dd4e042d8190edf3c` | `results/phase11/` |',
          )
          text = text.replace(
              '| `phase12-model-resource-ablation-v1` | Protocol frozen, execution pending | Local Ollama + local hardware | `results/phase12/` after execution |',
              '| `phase12-model-resource-ablation-v1` | Completed, three-model single-host ablation | Local Ollama + local hardware, commit `294fa7742057d026f4762d0dd4e042d8190edf3c` | `results/phase12/` |',
          )
          text = text.replace(
              '| `phase13-final-statistical-synthesis` | Prepared; runs after Phase 11/12 | GitHub Actions | `results/phase13/` after synthesis |',
              '| `phase13-final-statistical-synthesis` | Completed, retrospective synthesis | GitHub Actions `34623132400` | `results/phase13/` |',
          )
          marker = '## Phase 11 frozen protocol\n'
          if marker not in text:
              raise SystemExit('Phase 11 marker not found')
          prefix = text.split(marker, 1)[0]
          suffix = '''## Phase 11 provenance\n\n- Study role: held-out paired mitigation study designed after Phase 9 failure analysis.\n- Frozen config SHA-256: `67256169ceac0fa2cb51376c58e5088d4f7661a543fbcaff60df0c70450cd837`.\n- Model: `qwen3:14b-q4_K_M` via local Ollama; temperature `0`; `think=false`; JSON-schema output.\n- Held-out seeds: `7701`, `7702`, `7703`; total scenarios: `108`; no automatic retries.\n- The same raw model response was scored both before and after the deterministic epistemic gate.\n- Gate thresholds were frozen before held-out execution and use observable telemetry/evidence agreement only, not ground-truth labels.\n- Baseline policy conformance: `57/108 = 0.5278`.\n- Gated policy conformance: `108/108 = 1.0000`; absolute delta `+0.4722`.\n- Known-case preservation: `36/36 = 1.0000`.\n- Required-defer capture: `72/72 = 1.0000`.\n- Paired exact McNemar: 0 baseline-only versus 51 gated-only correct discordant pairs; `p = 8.881784197e-16`.\n- Unsafe false authorizations: `0`.\n- Mean model-call latency: `24.889 s`; median `25.315 s`; mean generation throughput `5.122 tok/s`.\n- Result commit: `294fa7742057d026f4762d0dd4e042d8190edf3c`.\n- Interpretation: on this newly held-out synthetic benchmark, the frozen evidence-sufficiency gate corrected the Phase 9-style abstention failures without sacrificing the tested known/adversarial cases. This does not establish flight readiness.\n\n## Phase 12 provenance\n\n- Study role: precommitted three-model local resource/quality ablation using the unchanged Phase 11 epistemic gate.\n- Frozen config SHA-256: `2abb33231d014bb5922c5938435cd209aff3aed7631488da14f12821d7376516`.\n- Held-out seed: `8801`; 36 identical scenarios per model; 108 total model calls.\n- Models: `qwen3:4b`, `qwen3:8b`, `qwen3:14b-q4_K_M`.\n- Small / 4B: gated policy `35/36 = 0.9722`; known preserve `11/12 = 0.9167`; required defer `24/24 = 1.0000`; warm mean `8.227 s`; throughput `18.602 tok/s`; peak process-family RSS `4.184 GiB`; Ollama-reported VRAM `2.960 GiB`.\n- Medium / 8B: gated policy `36/36 = 1.0000`; known preserve `12/12 = 1.0000`; required defer `24/24 = 1.0000`; warm mean `9.051 s`; throughput `14.864 tok/s`; peak process-family RSS `6.423 GiB`; Ollama-reported VRAM `5.187 GiB`.\n- Large / 14B: gated policy `36/36 = 1.0000`; known preserve `12/12 = 1.0000`; required defer `24/24 = 1.0000`; warm mean `26.380 s`; throughput `4.730 tok/s`; peak process-family RSS `10.656 GiB`; Ollama-reported VRAM `6.113 GiB`.\n- Direct `nvidia-smi` telemetry remained unavailable; Ollama VRAM is reported allocation, not independent hardware-sensor validation.\n- Result commit: `294fa7742057d026f4762d0dd4e042d8190edf3c`.\n- Interpretation: medium and small are Pareto-efficient under the stated quality/latency/RSS objective. The benchmark is synthetic and the resource study is single-host.\n\n## Phase 13 provenance\n\n- Study role: retrospective statistical synthesis of completed Phase 11 and Phase 12 results; no new model calls.\n- GitHub Actions run: `34623132400`.\n- Result commit: `02acaf86e5da86141543c1e29e7d281486dad0e6`.\n- Phase 11 baseline policy conformance: `57/108 = 0.5278`, 95% Wilson interval `0.4343-0.6194`.\n- Phase 11 gated policy conformance: `108/108 = 1.0000`, 95% Wilson interval `0.9657-1.0000`.\n- Small-model gated conformance: `35/36 = 0.9722`, 95% Wilson interval `0.8583-0.9951`.\n- Medium- and large-model gated conformance: `36/36 = 1.0000`, 95% Wilson interval `0.9036-1.0000` each.\n- Pairwise model McNemar tests are non-significant on the 36 paired cases (`p=1` for all three pairings).\n- Pareto-efficient labels: `small`, `medium`.\n- Interpretation: Phase 13 quantifies uncertainty around the follow-up results without promoting the synthetic/single-host evidence into operational spacecraft-safety claims.\n'''
          p.write_text(prefix + suffix, encoding='utf-8')
          PY
      - name: Commit documentation sync
        run: |
          git config user.name "Mahmoud Karzoun"
          git config user.email "135722882+mkarson1997@users.noreply.github.com"
          git add experiments/RESULTS_INDEX.md
          git commit -m "docs: finalize Phase 11-13 provenance index"
          git pull --rebase origin main
          git push origin HEAD:main
