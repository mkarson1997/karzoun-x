name: Phase 7A Expanded Robustness

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: phase7a-expanded-robustness
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install runtime dependencies
        run: python -m pip install numpy==2.3.3
      - name: Run frozen Phase 7A experiment
        run: |
          python scripts/run_phase7a_robustness.py | tee results-phase7a.log
          cat results/phase7a/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 7A machine-generated results
        uses: actions/upload-artifact@v4
        with:
          name: karzoun-x-phase7a-expanded-robustness
          path: |
            results/phase7a/
            results-phase7a.log
          if-no-files-found: error
          retention-days: 90
