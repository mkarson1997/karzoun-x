name: Preprint Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "paper/**"
      - ".github/workflows/preprint-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-dejavu-core \
            lmodern \
            librsvg2-bin \
            poppler-utils

      - name: Validate builder syntax
        run: python -m compileall -q paper/build_preprint.py

      - name: Build final v1 preprint PDF and DOCX
        run: python paper/build_preprint.py --source paper/manuscript_v1.md --output-dir dist

      - name: Preflight final v1 PDF
        run: |
          pdfinfo dist/KARZOUN-X-preprint-v1.0.0.pdf
          pdftotext dist/KARZOUN-X-preprint-v1.0.0.pdf dist/preprint.txt
          grep -F "KARZOUN-X" dist/preprint.txt
          grep -F "Phase 11" dist/preprint.txt
          grep -F "Phase 12" dist/preprint.txt
          grep -F "Phase 13" dist/preprint.txt
          grep -F "References" dist/preprint.txt
          grep -F "10.5281/zenodo.22712634" dist/preprint.txt

      - name: Upload final v1 preprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: KARZOUN-X-preprint-v1.0.0
          path: |
            dist/KARZOUN-X-preprint-v1.0.0.pdf
            dist/KARZOUN-X-preprint-v1.0.0.docx
          if-no-files-found: error
          retention-days: 90
