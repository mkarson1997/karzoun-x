name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked binary dependencies
        run: 'python -m pip install --only-binary=:all: --no-deps -r requirements-ci.txt'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
